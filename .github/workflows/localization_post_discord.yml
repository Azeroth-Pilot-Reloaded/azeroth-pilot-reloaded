name: Localization ping

on:
  workflow_dispatch:
    inputs:
      locales:
        description: "Comma-separated list of locales to check (e.g., frFR,deDE,ruRU)"
        required: false
        default: "frFR,deDE,ruRU"
  schedule:
    - cron: "0 10,16 * * *"

concurrency:
  group: localization-ping
  cancel-in-progress: false

jobs:
  translations:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # -------------------------------------------------------------------
      # Checkout repository
      # -------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # Restore the last successful notification state independently from Git.
      - name: Restore localization state
        uses: actions/cache/restore@v5
        with:
          path: .github/scripts/localization-state.json
          key: localization-state-${{ github.run_id }}
          restore-keys: |
            localization-state-

      # -------------------------------------------------------------------
      # Set up Python
      # -------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # --------------------------------------------------
      # Install Chrome system dependencies (CRITICAL)
      # --------------------------------------------------
      - name: Install Chrome system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libxkbcommon0 \
            fonts-liberation

      # -------------------------------------------------------------------
      # Install Google Chrome (for possible Selenium/Playwright if used)
      # -------------------------------------------------------------------
      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Verify Chrome installation
        run: |
          echo "Checking Chrome binary..."
          which google-chrome
          google-chrome --version

      # -------------------------------------------------------------------
      # Python dependencies
      # -------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv pydoll-python beautifulsoup4

      - name: Run localization notification tests
        run: |
          python -m unittest discover -s .github/scripts -p 'localization_post_discord_tests.py'

      # -------------------------------------------------------------------
      # Run localization scraper
      # -------------------------------------------------------------------
      - name: Run translation check
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          LOCALES: ${{ github.event.inputs.locales }}
        run: |
          python .github/scripts/localization_post_discord.py --prepare "$RUNNER_TEMP/localization-message.txt"

      # Persist last_ping before posting. If persistence fails, Discord is not
      # called, so the same notification cannot be sent repeatedly.
      - name: Save localization state
        uses: actions/cache/save@v5
        with:
          path: .github/scripts/localization-state.json
          key: localization-state-${{ github.run_id }}

      - name: Send prepared Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_LOCALES_WEBHOOK }}
        run: |
          python .github/scripts/localization_post_discord.py --send "$RUNNER_TEMP/localization-message.txt"

