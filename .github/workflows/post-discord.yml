name: Discord Release Notification

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to notify"
        required: true
        type: string
    secrets:
      DISCORD_WEBHOOK_URL:
        required: true

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests python-dotenv

      - name: Get release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" --json body --jq .body -- "$RELEASE_TAG" > "$RUNNER_TEMP/discord-release-notes.md"

      - name: Post release notes to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          RELEASE_BODY=$(cat "$RUNNER_TEMP/discord-release-notes.md")
          export RELEASE_BODY
          python .github/scripts/post_discord.py
