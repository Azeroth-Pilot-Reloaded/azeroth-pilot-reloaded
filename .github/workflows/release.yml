name: Release Addon

on:
  release:
    types: [published]
  # Automatic alpha releases are paused. Uncomment push and schedule to re-enable them.
  # push:
  #   branches:
  #     - '**'
  #     # Automation can push using a personal token, so also exclude its branches.
  #     - '!interface-version'
  #     - '!automation/**'
  # Catch up on default-branch changes skipped during the alpha cooldown.
  # schedule:
  #   - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (leave empty to force an alpha on the selected branch)"
        required: false
        type: string

env:
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
  WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

jobs:
  release:
    if: github.repository == 'Azeroth-Pilot-Reloaded/azeroth-pilot-reloaded' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone project
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Use GitHub release notes as changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body,isDraft > "$RUNNER_TEMP/release-notes.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads((Path(os.environ["RUNNER_TEMP"]) / "release-notes.json").read_text(encoding="utf-8"))
          body = release.get("body") or ""
          if release.get("isDraft") or not body.strip():
              raise SystemExit("Publish the GitHub release with non-empty release notes before packaging.")

          Path("CHANGELOG.md").write_text(body, encoding="utf-8")
          with Path(".pkgmeta").open("a", encoding="utf-8") as pkgmeta:
              pkgmeta.write("\nmanual-changelog:\n  filename: CHANGELOG.md\n  markup-type: markdown\n")
          PY

      - name: WoW Packager
        # v2.6+ recognizes WoW Forever (Interface 16001) on CurseForge and Wago.
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -p 618667 -w 26457 -a XKq9xXKy

  release-alpha:
    if: >-
      github.repository == 'Azeroth-Pilot-Reloaded/azeroth-pilot-reloaded' &&
      github.event_name != 'release' &&
      !startsWith(github.ref, 'refs/tags/') &&
      ((github.event_name == 'push' &&
        github.actor != 'github-actions[bot]' &&
        github.event.head_commit.committer.username != 'github-actions[bot]') ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag == ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    concurrency:
      group: release-alpha
      cancel-in-progress: false
    steps:
      - name: Clone project
        uses: actions/checkout@v7.0.1
        with:
          # Match the SHA recorded in workflow history, including scheduled runs.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check alpha cooldown
        id: alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/alpha_release.py

      - name: WoW Packager (alpha)
        if: steps.alpha.outputs.publish == 'true'
        # Keep this name stable: the cooldown uses successful packager steps.
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -p 618667 -w 26457 -a XKq9xXKy
