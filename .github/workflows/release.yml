name: Release Addon

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: false
        type: string

env:
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
  WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

jobs:
  release:
    if: github.repository == 'Azeroth-Pilot-Reloaded/azeroth-pilot-reloaded' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''))
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Generate client TOCs
        run: python tools/package/generate_client_tocs.py

      - name: WoW Packager
        # v2.6+ recognizes WoW Forever (Interface 16001) on CurseForge and Wago.
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -p 618667 -w 26457 -a XKq9xXKy


  release-alpha:
    if: github.repository == 'Azeroth-Pilot-Reloaded/azeroth-pilot-reloaded' && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Generate client TOCs
        run: python tools/package/generate_client_tocs.py

      - name: WoW Packager (alpha)
        # Non-tag pushes are published as alpha builds.
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -p 618667 -w 26457 -a XKq9xXKy
