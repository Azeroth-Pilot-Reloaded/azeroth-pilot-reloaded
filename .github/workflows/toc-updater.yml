name: Update TOC Interface versions

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-toc-interface-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Test the updater
        run: |
          python -m py_compile .github/scripts/toc-updater.py
          python -m unittest discover -s .github/scripts -p 'toc_updater_tests.py'

      - name: Resolve Blizzard builds and update APR.toc
        run: python .github/scripts/toc-updater.py --ptr

      - name: Validate the generated change
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "APR.toc" ]; then
            echo "The updater changed an unexpected file:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GIT_TOKEN || secrets.GITHUB_TOKEN }}
          branch: interface-version
          delete-branch: true
          add-paths: APR.toc
          commit-message: Update supported WoW Interface versions
          title: Update supported WoW Interface versions
          body: |
            Automated update of `## Interface` and `## X-Interface` in `APR.toc`.

            Builds were resolved from Blizzard's HTTPS product feeds for Retail and its PTR channels.
            Existing supported Interface versions are preserved, and the updater's regression tests and whitespace validation completed successfully.
