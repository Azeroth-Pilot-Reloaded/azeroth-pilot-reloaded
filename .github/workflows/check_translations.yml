name: Check translations

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: localization-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  translations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Compare the actual PR head with its merge base, including fork PRs.
          ref: ${{ github.event.pull_request.head.sha || inputs.branch || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv termcolor

      - name: Run translation check
        id: translation_check
        continue-on-error: true
        shell: bash
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          args=(--skip-similarity-check --json-output translation-report.json)
          if [ -n "$PR_BASE_SHA" ]; then
            args+=(--base-ref "$PR_BASE_SHA")
          fi
          if [ -n "$CF_API_KEY" ]; then
            python .github/scripts/check_translation_string.py "${args[@]}"
          else
            python .github/scripts/check_translation_string.py "${args[@]}" --skip-reason "CF_API_KEY is unavailable (for example, on a fork PR). CurseForge validation was skipped."
          fi

      - name: Add report to job summary
        if: always()
        run: |
          if [ -f translation-report.md ]; then
            cat translation-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Publishing happens in the trusted workflow_run reporter, including for
      # fork PRs whose GITHUB_TOKEN cannot write comments.
      - name: Upload localization report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localization-report-${{ github.run_attempt }}
          path: |
            translation-report.md
            translation-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail job if translations check failed
        if: steps.translation_check.outcome == 'failure'
        run: exit 1
